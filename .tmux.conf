# ==========================================
# Initial setup - macOS
# ==========================================

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g status-keys vi

# ==========================================
# Prefix keys: C-j and C-f
# ==========================================

set-option -g prefix C-j
set-option -g prefix2 C-f

unbind-key C-j
bind-key C-j send-prefix

set -g base-index 1
set-window-option -g pane-base-index 1

# ==========================================
# Use Option/Alt + Arrow to switch panes
# ==========================================

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ==========================================
# Easier window splitting
# ==========================================

bind-key v split-window -h
bind-key h split-window -v

# ==========================================
# Shift + Arrow to switch windows
# ==========================================

bind -n S-Left  previous-window
bind -n S-Right next-window

# ==========================================
# Ctrl + Shift + Arrow to reorder windows
# ==========================================

bind -n C-S-Left  swap-window -t -1
bind -n C-S-Right swap-window -t +1

# ==========================================
# Synchronize panes
# ==========================================

bind-key y set-window-option synchronize-panes \; \
    display-message "synchronize mode toggled."

# ==========================================
# Reload configuration
# ==========================================

bind-key r source-file ~/.tmux.conf \; \
    display-message "tmux.conf reloaded."

# ==========================================
# Clear pane history
# ==========================================

bind-key L clear-history

# ==========================================
# Copy and paste - vi mode
# ==========================================

setw -g mode-keys vi

unbind p
bind p paste-buffer

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# Copy to macOS system clipboard
set -g set-clipboard on
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ==========================================
# Mouse support
# ==========================================

set -g mouse on

# ==========================================
# Status message timing
# ==========================================

set-option -g display-time 3000
set-option -g display-panes-time 3000

# ==========================================
# Window titles
# ==========================================

set-window-option -g automatic-rename on
set-option -g set-titles on

# ==========================================
# Timing and responsiveness
# ==========================================

set-option -g repeat-time 400
set-option -sg escape-time 0

# ==========================================
# Theme (Catppuccin Mocha colours, no plugins)
# To revert: delete this section, or restore ~/.tmux.conf.pre-theme
# ==========================================

set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#cdd6f4"

# Left: session name
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "

# Right: PREFIX / SYNC indicators, then date and time
set -g status-right-length 80
set -g status-right "#{?client_prefix,#[bg=#f38ba8 fg=#1e1e2e bold] PREFIX #[default] ,}#{?pane_synchronized,#[bg=#fab387 fg=#1e1e2e bold] SYNC #[default] ,}#[fg=#a6adc8]%a %d %b #[fg=#cdd6f4 bold]%H:%M "

# Window tabs ([Z] marks a zoomed pane)
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#7f849c] #I #W#{?window_zoomed_flag, [Z],} "
setw -g window-status-current-format "#[bg=#313244 fg=#89b4fa bold] #I #[fg=#cdd6f4]#W#{?window_zoomed_flag, [Z],} "

# Pane borders
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# Messages, command prompt and copy-mode selection
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"

# Pane numbers (prefix q) and clock (prefix t)
set -g display-panes-active-colour "#89b4fa"
set -g display-panes-colour "#45475a"
setw -g clock-mode-colour "#89b4fa"
